<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Model Reports — Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0e17;
      --bg-elev: #1a1926;
      --bg-card: #222130;
      --border: #3a3a52;
      --text: #f0ece4;
      --text-muted: #a8a3b5;
      --accent: #e6b87e;
      --accent-hover: #f0d0a0;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
      --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: var(--noise), radial-gradient(1200px 600px at 20% -10%, rgba(230, 184, 126, 0.08), transparent 70%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 0;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 56px 28px 80px;
    }

    header {
      margin-bottom: 56px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 120px;
      height: 2px;
      background: var(--accent);
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 4px 14px 4px 0;
      margin-bottom: 16px;
      border-right: 2px solid var(--accent);
      padding-right: 16px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
      color: var(--text);
      line-height: 1.1;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 400;
      max-width: 600px;
      margin: 0;
      letter-spacing: 0.01em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 36px 0 28px;
      flex-wrap: wrap;
    }

    .count {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 450;
    }

    .count strong {
      color: var(--text);
      font-weight: 600;
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 340px;
    }

    .search input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .search input::placeholder { color: var(--text-muted); opacity: 0.7; }

    .search input:focus {
      border-color: var(--accent);
      background: #262536;
      box-shadow: 0 0 0 3px rgba(230, 184, 126, 0.15);
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
      opacity: 0.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      padding: 24px 24px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), border-color 0.25s, box-shadow 0.3s, background 0.25s;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--noise);
      opacity: 0.04;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.005);
      border-color: var(--accent);
      background: #2b2a3d;
      box-shadow: 0 12px 40px rgba(230, 184, 126, 0.12);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .index-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--bg);
      background: var(--accent);
      padding: 3px 10px;
      border-radius: 20px;
      font-variant-numeric: tabular-nums;
      opacity: 0.9;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 4px;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 14px;
      font-family: 'Inter', ui-monospace, monospace;
      letter-spacing: 0.02em;
      word-break: break-all;
      opacity: 0.7;
    }

    .arrow {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      transition: gap 0.2s, color 0.2s;
      letter-spacing: 0.02em;
    }

    .card:hover .arrow {
      gap: 14px;
      color: var(--accent-hover);
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 15px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: var(--bg-elev);
      font-weight: 400;
    }

    footer {
      margin-top: 72px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      letter-spacing: 0.02em;
      opacity: 0.6;
    }

    @media (max-width: 640px) {
      .container { padding: 32px 16px 64px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search { max-width: none; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="eyebrow">Archived</span>
      <h1>Model Reports</h1>
      <p class="subtitle">Evaluation reports from June 2026 &mdash; plus a recent August update. Browse the collection.</p>
    </header>

    <div class="toolbar">
      <span class="count"><strong id="visible">0</strong> of <span id="total">0</span> reports</span>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="filter" type="search" placeholder="Filter reports..." aria-label="Filter reports" />
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty" style="display:none;">
      No reports match your filter.
    </div>

    <footer>
      Archived reports &middot; static index
    </footer>
  </div>

  <script>
    (function () {
      var reports = [
        { file: "ai_model_report_june_2026_01.html",                title: "Report 01",               tag: "01" },
        { file: "ai_model_report_june_2026_02_GLM-5.2-Max.html",   title: "GLM-5.2 Max",             tag: "02" },
        { file: "ai_model_report_june_2026_03_Kimi-K2.7.html",     title: "Kimi K2.7",               tag: "03" },
        { file: "ai_model_report_june_2026_04_Qwen3.7-Max.html",    title: "Qwen3.7 Max",             tag: "04" },
        { file: "ai_model_report_june_2026_05_GLM-5.2-High.html",  title: "GLM-5.2 High",            tag: "05" },
        { file: "ai_model_report_june_2026_06_MiMo-V2.5-Pro.html", title: "MiMo V2.5 Pro",          tag: "06" },
        { file: "ai_model_report_june_2026_07_MiniMax-M3.html",    title: "MiniMax M3",              tag: "07" },
        { file: "ai_model_report_june_2026_08_Qwen3.7-Plus.html",  title: "Qwen3.7 Plus",            tag: "08" },
        { file: "ai_model_report_june_2026_09_Hy3.html",           title: "Hy3",                     tag: "09" },
        { file: "ai_model_report_june_2026_10_DeepSeek-V4-Pro.html", title: "DeepSeek V4 Pro",       tag: "10" },
        { file: "ai_model_report_june_2026_11_Sonnet-4.6-High.html", title: "Sonnet 4.6 High",       tag: "11" },
        { file: "ai_model_report_june_2026_12_Kimi-K2.6.html",     title: "Kimi K2.6",                tag: "12" },
        { file: "ai_model_report_june_2026_13_GLM-5.1-High.html",  title: "GLM-5.1 High",            tag: "13" },
        { file: "ai_model_report_june_2026_14_Sonnet-5-Extra.html", title: "Sonnet 5 Extra",         tag: "14" },
        { file: "ai_model_report_june_2026_15.html",               title: "Report 15",              tag: "15" },
        { file: "ai_model_report_june_2026_16_mistral-large-3.html", title: "Mistral Large 3",      tag: "16" },
        { file: "ai_model_report_aug_2026_01_deepseek-v4-flash-max-ds.html", title: "DeepSeek V4 Flash Max DS", tag: "17" }
      ];

      var grid = document.getElementById("grid");
      var empty = document.getElementById("empty");
      var visible = document.getElementById("visible");
      var total = document.getElementById("total");
      var filter = document.getElementById("filter");

      total.textContent = reports.length;

      function friendlyName(file) {
        return file.replace(/\.html$/, "");
      }

      function render(query) {
        var q = (query || "").trim().toLowerCase();
        var filtered = q
          ? reports.filter(function (r) {
              return (r.title + " " + r.file).toLowerCase().indexOf(q) !== -1;
            })
          : reports;

        grid.innerHTML = "";
        visible.textContent = filtered.length;

        if (filtered.length === 0) {
          empty.style.display = "block";
          return;
        }
        empty.style.display = "none";

        filtered.forEach(function (r) {
          var a = document.createElement("a");
          a.className = "card";
          a.href = encodeURIComponent(r.file);
          a.target = "_blank";

          a.innerHTML =
            '<div class="card-top">' +
              '<span class="index-badge">#' + r.tag + "</span>" +
            "</div>" +
            '<h2 class="card-title">' + r.title + "</h2>" +
            '<div class="card-meta">' + friendlyName(r.file) + "</div>" +
            '<span class="arrow">Open report' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
              'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
              'stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line>' +
              '<polyline points="12 5 19 12 12 19"></polyline></svg>' +
            "</span>";

          grid.appendChild(a);
        });
      }

      filter.addEventListener("input", function () {
        render(filter.value);
      });

      render("");
    })();
  </script>
</body>
</html>
