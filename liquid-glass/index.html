<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass — Demos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f9fc;
      --surface: #ffffff;
      --border: #e6e8ed;
      --text: #1a1b1e;
      --text-secondary: #5a5d6a;
      --text-muted: #8e919f;
      --accent: #4a6cf7;
      --accent-hover: #3a5cd5;
      --shadow: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-hover: 0 12px 32px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1120px;
      width: 100%;
      padding: 0 16px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 48px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 400;
      max-width: 580px;
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 32px 0 28px;
      flex-wrap: wrap;
    }

    .count {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .count strong {
      color: var(--text);
      font-weight: 600;
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 300px;
    }

    .search input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 60px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
    }

    .search input::placeholder {
      color: var(--text-muted);
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.12);
    }

    .search svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      padding: 24px 20px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: var(--shadow);
      animation: fadeUp 0.5s ease both;
      animation-delay: calc(0.02s * var(--i, 0));
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow-hover);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .index-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(74, 108, 247, 0.08);
      padding: 2px 10px;
      border-radius: 40px;
      border: 1px solid rgba(74, 108, 247, 0.12);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px;
      line-height: 1.3;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      font-family: 'Inter', ui-monospace, monospace;
      font-weight: 400;
      word-break: break-all;
    }

    .arrow {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      transition: gap 0.2s;
    }

    .card:hover .arrow {
      gap: 8px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 15px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      font-weight: 400;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .container { padding: 0 8px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search { max-width: none; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="eyebrow">Liquid Glass · Demos</span>
      <h1>Liquid Glass</h1>
      <p class="subtitle">
        A collection of standalone liquid-glass HTML previews. Click any card to
        open the demo.
      </p>
    </header>

    <div class="toolbar">
      <span class="count"><strong id="visible">0</strong> of <span id="total">0</span> demos</span>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="filter" type="search" placeholder="Filter demos..." aria-label="Filter demos" />
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty" style="display:none;">
      No demos match your filter.
    </div>

    <footer>
      Liquid glass demos &middot; static index generated for local navigation
    </footer>
  </div>

  <script>
    (function () {
      var demos = [
        { file: "liquid-glass-deepseek-v4-flash-max-ds.html", title: "DeepSeek V4 Flash Max DS", tag: "01" },
        { file: "liquid-glass-deepseek-v4-flash-max.html",    title: "DeepSeek V4 Flash Max", tag: "02" },
        { file: "liquid-glass-deepseek-v4-pro-max.html",      title: "DeepSeek V4 Pro Max", tag: "03" },
        { file: "liquid-glass-dola-seed-2.0-pro-high.html",   title: "Dola Seed 2.0 Pro High", tag: "04" },
        { file: "liquid-glass-glm-5.2-byteplus.html",         title: "GLM 5.2 BytePlus", tag: "05" },
        { file: "liquid-glass-glm-5.2-high.html",             title: "GLM 5.2 High", tag: "06" },
        { file: "liquid-glass-glm-5.2-max.html",              title: "GLM 5.2 Max", tag: "07" },
        { file: "liquid-glass-grok-4.5-high.html",            title: "Grok 4.5 High", tag: "08" },
        { file: "liquid-glass-hy3.html",                      title: "HY3", tag: "09" },
        { file: "liquid-glass-kimi-k3-high.html",             title: "Kimi K3 High", tag: "10" },
        { file: "liquid-glass-macaron-v1-venti-high.html",    title: "Macaron V1 Venti High", tag: "11" },
        { file: "liquid-glass-mimo-v2.5-pro-high.html",       title: "Mimo V2.5 Pro High", tag: "12" },
        { file: "liquid-glass-minimax-m3-thinking.html",      title: "MiniMax M3 Thinking", tag: "13" },
        { file: "liquid-glass-opus-4.8-high.html",            title: "Opus 4.8 High", tag: "14" },
        { file: "liquid-glass-qwen3.7-plus-thinking.html",    title: "Qwen3.7 Plus Thinking", tag: "15" },
        { file: "liquid-glass-qwen3.8-max.html",              title: "Qwen3.8 Max", tag: "16" },
        { file: "liquid-glass-qwen3-coder-next.html",         title: "Qwen3 Coder Next", tag: "17" },
        { file: "liquid-glass-sonnet-4.6-high.html",          title: "Sonnet 4.6 High", tag: "18" },
        { file: "liquid-glass-sonnet-5-thinking-high.html",   title: "Sonnet 5 Thinking High", tag: "19" },
        { file: "liquid-glass-step-3.7-flash-high.html",      title: "Step 3.7 Flash High", tag: "20" }
      ];

      var grid = document.getElementById("grid");
      var empty = document.getElementById("empty");
      var visible = document.getElementById("visible");
      var total = document.getElementById("total");
      var filter = document.getElementById("filter");

      total.textContent = demos.length;

      function friendlyName(file) {
        return file.replace(/\.html$/, "");
      }

      function render(query) {
        var q = (query || "").trim().toLowerCase();
        var filtered = q
          ? demos.filter(function (r) {
              return (r.title + " " + r.file).toLowerCase().indexOf(q) !== -1;
            })
          : demos;

        grid.innerHTML = "";
        visible.textContent = filtered.length;

        if (filtered.length === 0) {
          empty.style.display = "block";
          return;
        }
        empty.style.display = "none";

        filtered.forEach(function (r, idx) {
          var a = document.createElement("a");
          a.className = "card";
          a.href = r.file;
          a.target = "_blank";
          a.style.setProperty('--i', idx);

          a.innerHTML =
            '<div class="card-top">' +
              '<span class="index-badge">#' + r.tag + "</span>" +
            "</div>" +
            '<h2 class="card-title">' + r.title + "</h2>" +
            '<p class="card-meta">' + friendlyName(r.file) + "</p>" +
            '<span class="arrow">Open demo' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
              'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
              'stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line>' +
              '<polyline points="12 5 19 12 12 19"></polyline></svg>' +
            "</span>";

          grid.appendChild(a);
        });
      }

      filter.addEventListener("input", function () {
        render(filter.value);
      });

      render("");
    })();
  </script>
</body>
</html>
